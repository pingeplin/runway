[project]
name = "eval-overexplanation"
version = "0.1.0"
description = "Standalone benchmark harness measuring over-explanation (intra-document restatement) in blueprint-generated design docs and specs. See issue #10. Run on demand; never bundled into the plugin it grades."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# Live cross-family proposition extraction (fix #1). Not needed to run the
# offline unit suite, which uses the FixtureExtractor.
llm = [
    "anthropic>=0.40",
]
# Parse-based grammaticality checking. The default checker is dependency-free;
# this enables the stronger spaCy-backed checker.
nlp = [
    "spacy>=3.7",
]

[project.scripts]
overexpl = "eval_overexplanation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_overexplanation"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
