[project]
name = "pagination-task"
version = "0.0.1"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pagination"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
